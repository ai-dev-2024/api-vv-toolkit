[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "api-vv-toolkit"
version = "1.0.0"
description = "Reviewable API tests with requirements-to-verdict traceability"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "PyYAML>=6,<7", "httpx>=0.27,<1", "jsonschema>=4.22,<5", "jinja2>=3.1.4,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1", "mypy>=1.11,<2", "types-PyYAML", "types-jsonschema"]
demo = ["starlette>=0.40,<1", "uvicorn>=0.30,<1"]

[project.scripts]
api-vv = "api_vv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/api_vv"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "examples", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=api_vv --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["api_vv"]

