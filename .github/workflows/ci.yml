name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,demo]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict src
      - run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[demo]'
      # scripts/demo.py exits non-zero unless the gate fails on exactly REQ-003 and REQ-008.
      - run: python scripts/demo.py
      - name: Check the gate named exactly the two seeded defects
        run: grep -Fx 'Gate: FAIL (REQ-003, REQ-008)' runs/demo/cli-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-report
          path: |
            runs/demo/report.html
            runs/demo/junit.xml
            runs/demo/traceability.csv

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t api-vv:ci .
      - name: Smoke test
        run: |
          docker run --rm api-vv:ci --version
          docker run --rm -v "$PWD/examples/demo_api:/data:ro" api-vv:ci \
            validate-requirements --spec /data/openapi.yaml --requirements /data/requirements.yaml
